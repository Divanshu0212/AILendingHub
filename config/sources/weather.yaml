schema_version: "1.0"
id: weather
name: Weather and Climate Reanalysis (ERA5, CHIRPS, IMD)
kind: public
srs_ref: "SRS §2.1 (S5 Weather)"
description: >
  Gridded precipitation, temperature and reanalysis series for P2 climate-risk
  features. Registered in Phase 0; consumed from P2.

owner:
  business: "TBD[Head of Agri Credit, LH-120]"
  technical: "TBD[Geospatial DS Lead, LH-120]"
  data_sharing_approval: not_required_public_data

extract:
  mechanism: api
  cadence: daily
  latency_target: "per provider publication lag"
  notes: >
    Reanalysis products are revised after first publication. Ingest must keep the
    provider's version/vintage per grid-cell-day, or a point-in-time join will
    silently pick up a value that did not exist at the observation point.

classification:
  pii: "TBD[DPO, LH-110]"
  residency: exempt_public
retention:
  period: "TBD[DPO + Compliance, LH-111]"

point_in_time:
  event_timestamp: observation_date
  created_timestamp: product_published_at
  note: >
    Reanalysis products are revised after first publication, so the vintage must
    be kept per grid-cell-day. Without it a point-in-time join silently picks up
    a revised value that did not exist at the observation point.

entities:
  - grid_cell_id

status: not_started
