[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lending-hub"
version = "0.1.0"
description = "AI-Powered Smart Lending Decision Hub — Phase 0 platform foundations"
requires-python = ">=3.11"
# Deliberately minimal. The Phase 0 core (definitions, source registry, identity
# spine, point-in-time joins, decision log, grounding checks) is stdlib-only so
# that `make check` runs on a clean machine with no install step. See ADR-0003.
dependencies = []

[project.optional-dependencies]
# Track A (local reference implementation) — see ADR-0003.
local = [
  "PyYAML>=6.0",
]
# Track B (bank deployment) — heavy backends live behind the interfaces in
# src/lending_hub/*/ports.py. Not needed to run the test suite.
platform = [
  "PyYAML>=6.0",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "mlflow>=2.9",
  "feast>=0.36",
  "fastapi>=0.109",
  "uvicorn>=0.27",
]
dev = [
  "PyYAML>=6.0",
  "pytest>=7.4",
  "ruff>=0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
